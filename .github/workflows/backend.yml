name: Backend foundation
on:
  push:
    paths: ['backend/**', 'contracts/**', 'data/demo/**', 'scripts/**', 'compose.yaml', 'Makefile', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'contracts/**', 'data/demo/**', 'scripts/**', 'compose.yaml', 'Makefile', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make bootstrap migrate seed-demo provision-demo seed-events contract-check dev
      - run: make acceptance PHASE=0
      - run: make acceptance PHASE=1
      - run: make acceptance PHASE=2
      - run: make test
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
