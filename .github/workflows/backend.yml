name: Backend foundation
on:
  push:
    paths: ['backend/**', 'contracts/**', 'data/demo/**', 'data/annotations/**', 'data/evaluation/**', 'scripts/**', 'compose.yaml', 'compose.verify.yaml', 'Makefile', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'contracts/**', 'data/demo/**', 'data/annotations/**', 'data/evaluation/**', 'scripts/**', 'compose.yaml', 'compose.verify.yaml', 'Makefile', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make bootstrap migrate seed-demo provision-demo seed-events seed-rooms seed-faculty contract-check dev
      - run: make acceptance-all
      - run: make train-intent
      - run: make evaluate
      - run: make test
      - run: NLP_MODE=hybrid docker compose up -d --wait api
      - run: docker compose exec -T api python /workspace/scripts/acceptance_all.py --intent
      - run: NLP_MODE=baseline docker compose up -d --wait api
      - if: always()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
