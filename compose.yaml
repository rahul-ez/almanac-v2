name: almanac
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: almanac
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-almanac_local_demo}
      POSTGRES_DB: almanac_demo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almanac -d almanac_demo"]
      interval: 2s
      timeout: 2s
      retries: 20
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://almanac:almanac_local_demo@db:5432/almanac_demo}
      CAMPUS_TIMEZONE: ${CAMPUS_TIMEZONE:-Asia/Kolkata}
      APP_ENV: ${APP_ENV:-development}
      NLP_MODE: ${NLP_MODE:-baseline}
      INTENT_MODEL_PATH: ${INTENT_MODEL_PATH:-/workspace/.local/models/intent.json}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - .:/workspace
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
