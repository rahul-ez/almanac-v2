# Isolated packaged-image rehearsal: no published ports and no host source mounts.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: almanac
      POSTGRES_PASSWORD: ${ALMANAC_VERIFY_DB_PASSWORD:?Set an ephemeral verification password}
      POSTGRES_DB: almanac_demo
    volumes:
      - verification_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U almanac -d almanac_demo"]
      interval: 2s
      timeout: 2s
      retries: 30
  api:
    image: ${ALMANAC_VERIFY_IMAGE:?Build a verification image first}
    environment:
      DATABASE_URL: postgresql+psycopg://almanac:${ALMANAC_VERIFY_DB_PASSWORD}@db:5432/almanac_demo
      CAMPUS_TIMEZONE: Asia/Kolkata
      APP_ENV: test
      NLP_MODE: ${ALMANAC_VERIFY_MODE:-baseline}
    volumes:
      - verification_local:/workspace/.local
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  verification_db:
  verification_local:
